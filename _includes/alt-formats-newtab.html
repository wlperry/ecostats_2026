<script>
// Open the "RevealJS" entry in the "Other Formats" panel in a new tab,
// so clicking it for a live lecture doesn't navigate away from this page.
document.addEventListener("DOMContentLoaded", function () {
  document
    .querySelectorAll('.quarto-alternate-formats a[href$=".slides.html"]')
    .forEach(function (link) {
      link.setAttribute("target", "_blank");
      link.setAttribute("rel", "noopener");
    });
});
</script>
