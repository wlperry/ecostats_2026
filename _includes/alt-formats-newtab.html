<script>
// Make every link in the "Other Formats" panel (MS Word, PowerPoint, RevealJS)
// open in a new browser tab, so clicking one during a live lecture does not
// navigate away from the page you are on.
(function () {
  function openFormatsInNewTab() {
    document
      .querySelectorAll(".quarto-alternate-formats a")
      .forEach(function (link) {
        link.setAttribute("target", "_blank");
        link.setAttribute("rel", "noopener");
      });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", openFormatsInNewTab);
  } else {
    openFormatsInNewTab();
  }

  // Re-apply once more after layout settles, in case Quarto rebuilds the panel.
  setTimeout(openFormatsInNewTab, 500);
})();
</script>
