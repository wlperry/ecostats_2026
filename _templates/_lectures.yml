# =====================================================================
# Slide (RevealJS) + PowerPoint formats for LECTURE pages ONLY.
#
# Each *_lecture.qmd pulls this in via:
#   metadata-files:
#     - ../../_templates/_lectures.yml
#
# Activity worksheets deliberately do NOT reference this file, so they
# never inherit revealjs/pptx and their "Other Formats" panel offers the
# Word download only.
#
# Relative paths resolve from content/<topic>/ (the .qmd's own folder).
# =====================================================================

execute:
  message: false # Overrides the global setting to turn messages off for slides
  warning: false

format:
  html:
    format-links: [docx, pptx, revealjs]
  revealjs:
    output-ext: "slides.html"
    css: ../../css/main.css
    theme: [default, ../../css/theme.scss]
    slide-number: true
    transition: none
    background-transition: none
    scrollable: true
    smaller: true
    width: 1280
    height: 720
    margin: 0.1
    min-scale: 0.2
    max-scale: 2.0
    fig-width: 4
    fig-height: 4
  pptx:
    reference-doc: ../../ms_templates/lecture_template.pptx
    embed-resources: true
    fig-width: 4
    fig-height: 4
    fig-dpi: 300
