# Used for Activities, Assignments, and Homework
format:
  html:
    embed-resources: true
    self-contained: true
    max-width: 80ch
    toc: false
    fig-width: 5
    fig-height: 5
  docx:
    default: true
    toc: false
    toc-depth: 3
    number-sections: false
    highlight-style: github
    reference-doc: ../../ms_templates/custom-reference.docx
    embed-resources: true
    fig-width: 3
    fig-height: 3
    fig-dpi: 300
    dpi: 300            # tell Pandoc the real render dpi so it sizes figures correctly
