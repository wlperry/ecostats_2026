execute:
  freeze: auto
  cache: true
  echo: true
  keep-md: false
  message: true
  warning: true
  fig-height: 4
  fig-width: 5
  paged-print: false
format:
  html:
    css: ../../css/main.css
    code-overflow: scroll
    toc: false
    max-width: 80ch
    fig-width: 3.5
    fig-height: 3.5
  docx:
    default: true
    toc: false
    toc-depth: 3
    fig-width: 2.5    # 2.5 x 2.5 in figures in the Word handout
    fig-height: 2.5   # kept square so plots do not overflow the page
    fig-dpi: 300      # ragg (see _quarto.yml) embeds this dpi so Word sizes the figure correctly
    number-sections: false
    highlight-style: github
    reference-doc: ../../ms_templates/custom-reference.docx
    embed-resources: true
editor: visual