# =====================================================================
# Shared format settings for ALL module content under content/<topic>/.
# Merged on top of _quarto.yml. Each file only receives the format blocks
# it declares, so <topic>_lecture.qmd gets revealjs/pptx and
# <topic>_activity.qmd gets html/docx. Relative paths resolve from
# content/ to the project root, exactly as lectures/_metadata.yml did.
# =====================================================================

execute:
  message: false
  warning: false

format:
  html:
    format-links: [docx]
    max-width: 80ch
    toc: false
    fig-width: 5
    fig-height: 5
  revealjs:
    output-ext: "slides.html"
    css: ../css/main.css
    theme: [default, ../css/theme.scss]
    slide-number: true
    transition: fade
    background-transition: none
    scrollable: true
    smaller: true
    width: 1280
    height: 720
    margin: 0.1
    min-scale: 0.2
    max-scale: 2.0
    fig-width: 6
    fig-height: 6
  pptx:
    reference-doc: ../ms_templates/lecture_template.pptx
    embed-resources: true
    fig-width: 6.5
    fig-height: 4
    fig-dpi: 300
  docx:
    toc: false
    toc-depth: 3
    number-sections: false
    highlight-style: github
    reference-doc: ../ms_templates/custom-reference.docx
    fig-width: 3.5
    fig-height: 3.5
    fig-dpi: 72

resources:
  - "*.R"
