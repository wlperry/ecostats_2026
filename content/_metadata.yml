# =====================================================================
# Shared format settings for ALL module content under content/<topic>/.
# Merged on top of _quarto.yml.
#
# By default a content page offers HTML + a Word (.docx) download only —
# this is what the activity worksheets use, so an activity's "Other
# Formats" panel shows the Word link and nothing else.
#
# Lecture pages additionally pull in ../../_templates/_lectures.yml via
# their own `metadata-files:` key, which adds the RevealJS slides and
# PowerPoint formats plus their download links. Activities deliberately
# do NOT reference that file.
#
# Relative paths here resolve from content/ (this file's folder).
# =====================================================================

execute:
  message: false
  warning: false

format:
  html:
    format-links: [docx]
    include-after-body: ../_includes/alt-formats-newtab.html
    max-width: 80ch
    toc: false
    fig-width: 4
    fig-height: 4
  docx:
    toc: false
    toc-depth: 3
    number-sections: false
    highlight-style: github
    reference-doc: ../ms_templates/custom-reference.docx
    fig-width: 3.5
    fig-height: 3.5
    fig-dpi: 72

resources:
  - "*.R"
